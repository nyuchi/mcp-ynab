name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Locked environment. Catches code regressions.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run pytest
        env:
          YNAB_API_KEY: test-dummy-key

  # Fresh resolution from pyproject constraints, no lockfile. Catches the world
  # moving underneath us, which is what the locked job structurally cannot see.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/smoke_test.py

  # Typechecks the Worker that fronts the Container (worker/src/index.ts).
  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # Builds the Astro static site (worker/site) that Cloudflare serves via the
  # `assets` binding in wrangler.jsonc for "/" and "/privacy-policy" — this is
  # what `npm run deploy` (worker/package.json's build:site) runs before
  # `wrangler deploy`, so a broken build fails here instead of at deploy time.
  # Also runs an APCA contrast audit of the site's design tokens and an
  # axe-core accessibility/language pass over every built page.
  worker-site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:contrast
      - run: npx playwright install --with-deps chromium
      - run: npm run check:a11y

  # Validates the Worker itself deploys cleanly — entry point resolves,
  # wrangler.jsonc's bindings are well-formed, the built site satisfies the
  # `assets` binding — without needing Docker or real Cloudflare credentials
  # (--dry-run never calls the API; --containers-rollout=none skips the
  # image build, covered separately by the docker job below). This replaces
  # the equivalent check that used to run as Cloudflare's own Workers Builds
  # "Version command" on every push: that command runs from the repo root
  # regardless of the dashboard's configured root directory, so it always
  # failed with "Missing entry-point" on this repo's worker/-nested layout.
  # Moved here rather than fixed there since Workers Builds' Version command
  # has no per-branch root-directory override to fix it with.
  worker-deploy-dryrun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            worker/site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker/site
      - run: npm run build
        working-directory: worker/site
      - run: npx wrangler deploy --dry-run --containers-rollout=none
        env:
          CLOUDFLARE_API_TOKEN: dry-run-does-not-call-the-api

  # Builds worker/Dockerfile (image_build_context points back at the repo root
  # for its COPY paths) and boots it, the way Cloudflare's own build does when
  # the Worker is connected via Workers Builds. Catches breakage no local dev
  # environment without Docker can catch.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f worker/Dockerfile -t ynab-mcp-ci .
      - run: |
          docker run -d --name ynab-mcp-ci -p 8080:8080 \
            -e YNAB_API_KEY=test-dummy-key \
            -e MCP_AUTH_TOKEN=test-dummy-token \
            ynab-mcp-ci
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "container never became healthy" >&2
          exit 1
      - if: always()
        run: docker logs ynab-mcp-ci
