name: Auto tag

# Releasing is a version bump merged to main; nobody pushes a tag by hand.
# When CI passes on main, this reads the version and, if `v<version>`
# is not tagged yet, pushes that tag and publishes a GitHub release
# with the RELEASE_BUMP_TOKEN org secret, which starts publish.yml (tests, then PyPI).
# A merge that does not change the version finds its tag already there and
# does nothing. (GitHub starts no workflow from a tag or release made with
# GITHUB_TOKEN; that is why the PAT is used.)
#
# The logic is nyuchi/.github's reusable-auto-tag.yml.

# Versioning policy (nyuchi/.github#80): a release to main is the next
# MINOR above the highest tag, and the version file must say so (the run
# fails and names the right version otherwise); merges into staging are
# tagged as patches by staging-version.yml; a MAJOR only by hand, from the
# Actions tab with bump: major. Each segment holds 0..999.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Versioning policy override. main releases the next minor; a major
          is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@924e5b4d0983d31379aedbec02b990793f29c792  # main, 2026-10-04
    with:
      version-command: "grep -m1 -E '^version = ' pyproject.toml | cut -d'\"' -f2"
      bump: ${{ inputs.bump || '' }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      create-release: true
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
