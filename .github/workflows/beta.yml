name: Beta

# The live beta (nyuchi/.github#84): every push to `staging` creates or updates
# the Worker Preview named `staging`, served at
#   https://staging-mcp-ynab.nyuchi.workers.dev
#
# `wrangler preview` (wrangler 4.135+), not `wrangler versions upload
# --preview-alias`: this Worker fronts a Container, which is a Durable Object,
# and Cloudflare does not generate version or alias URLs for those. Each
# Preview gets its own DO namespace and its own container app, built here
# from worker/Dockerfile (Docker is on the hosted runner). Its other bindings
# are the `previews` block in worker/wrangler.jsonc, pointed at the same
# production resources. Nothing here runs `wrangler deploy`; production
# (ynab.nyuchi.com) still deploys through Workers Builds on main.
#
# Skips cleanly when CLOUDFLARE_API_TOKEN is not available to the repo.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-staging
  cancel-in-progress: true

jobs:
  preview:
    name: Update the staging Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: worker
    # The Cloudflare secrets reach the wrangler step alone, not the environment
    # of `npm ci` or the site build. That narrows exposure; it does not stop a
    # compromised dependency that tampers with the local wrangler.
    steps:
      - name: Cloudflare token configured
        id: cf
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; no beta upload."
          fi

      - uses: actions/checkout@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - if: steps.cf.outputs.ok == 'true'
        run: npm ci

      # The assets binding serves worker/site/dist; build it as Workers Builds does.
      - if: steps.cf.outputs.ok == 'true'
        run: npm run build:site

      - name: wrangler preview --name staging
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          out="$(npx wrangler preview --name staging --message "staging ${SHA::7}" --json)"
          printf '%s\n' "$out"
          url="$(printf '%s' "$out" | jq -r '.preview.urls[0] // empty' 2>/dev/null || true)"
          echo "Beta: ${url:-see the wrangler output}" >> "$GITHUB_STEP_SUMMARY"
